[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Without this, `pytest` (as opposed to `python -m pytest`) never puts the repo
# root on sys.path, so the fixtures' importlib.import_module("config") etc. fail
# with ModuleNotFoundError even though the same command works from an IDE/`python -m`.
pythonpath = .
